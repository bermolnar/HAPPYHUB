name: Hírek frissítése

on:
  schedule:
    # Minden nap 6:00, 12:00 és 18:00-kor (UTC) - kb. napi 3x friss jó hír.
    - cron: "0 6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Függőségek telepítése
        run: npm ci

      - name: Hírek gyűjtése és fordítása
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run fetch-news

      - name: Változások commitolása, ha van új hír
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Nincs változás, nem commitolok."
            exit 0
          fi
          git config user.name "happyhub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git commit -m "Hírek automatikus frissítése"
          git push
