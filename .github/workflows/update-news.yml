name: Hírek gyűjtése

on:
  schedule:
    # Minden nap 6:00, 12:00 és 18:00-kor (UTC) - kb. napi 3x friss jelölt.
    - cron: "0 6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Függőségek telepítése
        run: npm ci

      - name: Új angol cikkek gyűjtése a data/pending.json-ba
        run: npm run fetch-news

      - name: Változások commitolása, ha van új jelölt
        run: |
          if git diff --quiet -- data/pending.json; then
            echo "Nincs új jelölt, nem commitolok."
            exit 0
          fi
          git config user.name "happyhub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pending.json
          git commit -m "Új hírjelöltek gyűjtése (fordításra várnak)"
          git push
